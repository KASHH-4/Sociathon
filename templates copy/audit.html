<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TransitHear — Audit Log</title>
  <meta name="theme-color" content="#18233c" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/live/live.css" />
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="site-header" role="banner">
  <div class="header-inner">
    <span class="logo-mark" aria-hidden="true">▶</span>
    <span class="site-title">TransitHear <span class="badge-live">Audit Log</span></span>
    <nav class="header-nav" aria-label="Site navigation">
      <a href="/live" class="nav-link">← Live monitor</a>
      <a href="/" class="nav-link">App</a>
    </nav>
  </div>
</header>

<main id="main-content" class="main-content">
  <section class="card" aria-labelledby="summary-heading">
    <h2 id="summary-heading" class="card-title">Summary</h2>
    <dl id="summary-dl" class="summary-dl">
      <dt>Loading…</dt>
    </dl>
  </section>

  <section class="card" aria-labelledby="log-heading">
    <h2 id="log-heading" class="card-title">Recent decisions</h2>
    <div class="table-wrapper" role="region" aria-label="Audit log table" tabindex="0">
      <table id="audit-table" class="audit-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Decision</th>
            <th>STT</th>
            <th>Extract</th>
            <th>Resolve</th>
            <th>Verify</th>
            <th>Final</th>
            <th>Rules</th>
            <th>Extractor</th>
          </tr>
        </thead>
        <tbody id="audit-tbody">
          <tr><td colspan="9" class="muted-text">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="table-controls">
      <label for="limit-select" class="field-label">Show</label>
      <select id="limit-select" class="field-input field-input--sm">
        <option value="20">20</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
      </select>
      <button id="refresh-btn" class="btn btn-secondary">↺ Refresh</button>
    </div>
  </section>
</main>

<script src="/live/audit.js"></script>
</body>
</html>
